name: Daily Scryfall Card Refresh

on:
  schedule:
    # Runs daily at 06:00 UTC (after Scryfall's overnight bulk data build)
    - cron: '0 6 * * *'
  # Allows triggering manually from GitHub Actions UI anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and build card database
        run: npm run refresh:db

      - name: Check for database changes
        id: db_diff
        run: |
          if git diff --quiet public/cards.db; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No card updates detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New card data detected."
          fi

      - name: Commit and push updated database
        if: steps.db_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards.db
          git commit -m "Auto-refresh card database from Scryfall [skip ci]"
          git push

      - name: Deploy to Cloudflare (Production & Staging)
        if: steps.db_diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run deploy
          npm run deploy:staging
