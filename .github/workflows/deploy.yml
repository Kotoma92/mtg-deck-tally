name: Deploy Application

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging or production)'
        required: false
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging (Beta)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy to Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:staging

      - name: Add Staging Link to Step Summary
        run: |
          echo "### 🚀 Staging Deployment Ready!" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview URL:** [https://beta.tally.rolandtech.org](https://beta.tally.rolandtech.org)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please perform Quality Control (QC) on staging before approving and merging to production." >> $GITHUB_STEP_SUMMARY

      - name: Comment Staging URL on PR
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- staging-deploy-status -->';
            const body = `${marker}\n### 🚀 Staging Deployment Ready!\n\n- **Preview URL:** https://beta.tally.rolandtech.org\n- **Commit:** \`${context.sha.slice(0, 7)}\`\n\nPlease test and QC your changes on **beta.tally.rolandtech.org** before approving/merging to production.`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

  deploy-production:
    name: Deploy to Production
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run deploy
          npm run deploy:staging

      - name: Add Production Summary
        run: |
          echo "### ✅ Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** [https://tally.rolandtech.org](https://tally.rolandtech.org)" >> $GITHUB_STEP_SUMMARY
          echo "- Staging environment was also refreshed to match production." >> $GITHUB_STEP_SUMMARY
